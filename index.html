<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Coach 10K + Force</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">COACH ADAPTATIF</div>
        <h1>10K + Force</h1>
      </div>
      <button id="installBtn" class="ghost hidden">Installer</button>
    </header>

    <main id="view"></main>

    <nav class="bottom-nav" aria-label="Navigation">
      <button data-tab="today" class="nav-btn active"><span>◉</span><small>Aujourd’hui</small></button>
      <button data-tab="sessions" class="nav-btn"><span>▦</span><small>Séances</small></button>
      <button data-tab="history" class="nav-btn"><span>↗</span><small>Historique</small></button>
      <button data-tab="stats" class="nav-btn"><span>⌁</span><small>Analyse</small></button>
      <button data-tab="settings" class="nav-btn"><span>⚙</span><small>Réglages</small></button>
    </nav>
  </div>

  <dialog id="sessionDialog">
    <div id="sessionDialogContent"></div>
  </dialog>

  <dialog id="quickDialog">
    <div id="quickDialogContent"></div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
