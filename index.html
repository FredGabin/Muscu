<html lang="fr">
<head>

  <style>
:root{
  --bg:#0b0d10;--panel:#14171c;--panel2:#1b1f25;--line:#2a3038;
  --text:#f5f7fa;--muted:#9aa4b2;--accent:#ff8a24;--good:#31c76a;
  --blue:#4d8dff;--purple:#8567ff;--danger:#ff4d55;--warn:#f1c75b;
  --shadow:0 10px 30px rgba(0,0,0,.25)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;background:linear-gradient(180deg,#0b0d10 78%,rgba(11,13,16,.78));backdrop-filter:blur(10px)}
.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:800}
h1{font-size:24px;margin:2px 0 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.42}
#view{padding:6px 14px 98px;max-width:900px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:var(--shadow)}
.card.soft{background:var(--panel2)}
.hero{padding:18px;background:linear-gradient(135deg,#181d23,#211b17);border-color:#3b3026}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800;background:#252a31;color:#dfe5ec}
.badge.accent{background:#3a2513;color:#ffb66e}.badge.good{background:#143221;color:#72e99a}.badge.warn{background:#3a2d12;color:#ffd169}.badge.blue{background:#132744;color:#79adff}.badge.danger{background:#3b191d;color:#ff8d93}
.big{font-size:30px;font-weight:900;letter-spacing:-.03em}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.metric{background:#111419;border:1px solid #252b33;border-radius:14px;padding:12px}.metric .v{font-size:22px;font-weight:900}.metric .l{font-size:11px;color:var(--muted);margin-top:3px}
.primary,.secondary,.danger,.ghost{border:0;border-radius:13px;padding:12px 14px;font-weight:850}
.primary{background:var(--accent);color:#121212}.secondary{background:#252b33;color:var(--text)}.danger{background:#3c191d;color:#ff858c}.ghost{background:transparent;border:1px solid var(--line);color:var(--text);padding:9px 12px}
.primary:disabled,.secondary:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.full{width:100%}
.small{font-size:12px;color:var(--muted)}.tiny{font-size:10px;color:var(--muted)}.muted{color:var(--muted)}.accent{color:var(--accent)}
.scorebar{height:9px;border-radius:10px;background:#272c33;overflow:hidden;margin-top:7px}.scorebar>span{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--danger),var(--accent),var(--good))}
.session-card{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}.session-card.clickable{cursor:pointer}
.code{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#282017;color:#ffad5f;font-size:18px;font-weight:950}.code.run{background:#14243e;color:#79aaff}.code.rest{background:#20242a;color:#aab4c0}
.session-card p{margin:3px 0 0;color:var(--muted);font-size:13px}.chev{font-size:24px;color:#707b89}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 8px}.section-title h2{margin:0}
.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);padding:7px 3px calc(7px + env(safe-area-inset-bottom));background:#101317;border-top:1px solid #272d34}
.nav-btn{background:none;border:0;color:#808a97;display:grid;gap:2px;place-items:center;padding:4px 0;min-width:0}.nav-btn span{font-size:18px}.nav-btn small{font-size:9px;white-space:nowrap}.nav-btn.active{color:var(--accent)}
input,select,textarea{width:100%;background:#0e1115;border:1px solid #303741;color:var(--text);border-radius:12px;padding:11px}textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;font-weight:750;color:#c3cbd5;margin:10px 0 5px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exercise{border-top:1px solid #293039;padding:13px 0}.exercise:first-child{border-top:0}.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.ex-title{font-weight:900}.previous{font-size:11px;color:#8e99a7;margin-top:2px}.suggestion{font-size:11px;color:#ffb66e;margin-top:3px}
.set-grid{display:grid;grid-template-columns:28px 58px 1fr 1fr 48px 40px;gap:5px;align-items:center;margin-top:8px}.set-grid input{padding:9px 5px;text-align:center}.refcell{min-height:38px;display:grid;place-items:center;text-align:center;padding:4px;border-radius:9px;background:#0f1216;border:1px solid #2a3139;color:#b9c3cf;font-size:10px;font-weight:800;line-height:1.15}.today-list{display:grid;gap:8px}.today-entry{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid #2b323a;background:#111419;border-radius:14px}.today-entry .code{width:46px;height:46px}.run-detail{padding:13px 0;border-top:1px solid #282e36}.run-detail:first-child{border-top:0}.run-block{margin-top:7px;padding:9px 10px;border-radius:10px;background:#101318;border:1px solid #282f37;font-size:12px;line-height:1.45}.record-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #282e36}.record-row:last-child{border-bottom:0}.record-weight{font-size:19px;font-weight:950}.level-line{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #282e36}.level-line:last-child{border-bottom:0}.checkset{width:42px;height:42px;border:1px solid #39414b;background:#20252c;color:#fff;border-radius:11px}.checkset.done{background:#183724;color:#65df91;border-color:#245c39}
.timerbar{position:sticky;top:70px;z-index:10;background:#172019;border:1px solid #27472f;border-radius:14px;padding:10px 12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between}.timerbig{font-size:22px;font-weight:950;color:#72e99a}.elapsed{font-size:13px;font-weight:800;color:#d7dee7}
dialog{width:min(720px,calc(100% - 18px));max-height:88vh;overflow:auto;border:1px solid #343b45;border-radius:20px;background:#111419;color:var(--text);padding:0;box-shadow:0 30px 80px rgba(0,0,0,.6)}dialog::backdrop{background:rgba(0,0,0,.72)}
.dialog-inner{padding:17px}.dialog-head{position:sticky;top:0;background:#111419;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px}.close{width:38px;height:38px;border-radius:50%;border:1px solid #363e47;background:#20252b;color:#fff}
.history-item{padding:12px 0;border-bottom:1px solid #282e36}.history-item:last-child{border-bottom:0}.history-meta{font-size:12px;color:var(--muted);margin-top:3px}
.kpi{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #282e36}.kpi:last-child{border-bottom:0}.kpi strong{font-size:18px}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #282e36}.rank:last-child{border-bottom:0}.ranknum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#2a2f36;font-size:12px;font-weight:900}
.notice{font-size:12px;line-height:1.45;background:#171b20;border-left:3px solid var(--accent);padding:11px 12px;border-radius:8px}.notice.good{border-left-color:var(--good)}.notice.warn{border-left-color:var(--warn)}.notice.danger{border-left-color:var(--danger)}
.compat{font-size:12px;padding:7px 9px;border-radius:10px;display:inline-block;margin-top:6px}.compat.ok{background:#173321;color:#7fe19e}.compat.mid{background:#352d16;color:#f1cc68}.compat.no{background:#3b191d;color:#ff8d93}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#111419;padding:4px;border-radius:13px}.segment button{border:0;background:transparent;color:#a3adba;padding:9px;border-radius:10px;font-weight:850}.segment button.active{background:#2a3038;color:white}

.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}.calendar-title{font-size:18px;font-weight:900;text-transform:capitalize}.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar-weekdays div{text-align:center;font-size:10px;color:var(--muted);font-weight:800;padding:4px 0}
.day{min-height:74px;border:1px solid #292f36;background:#101318;border-radius:12px;padding:6px;position:relative;cursor:pointer;overflow:hidden}.day.other{opacity:.42}.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.day.selected{background:#1d232a}.daynum{font-size:11px;font-weight:850}.daydots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}.dot{font-size:9px;font-weight:900;padding:3px 4px;border-radius:6px;background:#2a3038;color:#d9e0e8}.dot.run{background:#132744;color:#79adff}.dot.strength{background:#3a2513;color:#ffb66e}.dot.done{outline:1px solid #31c76a}.dot.rest{background:#252a31;color:#aab4c0}.daymore{font-size:9px;color:var(--muted);margin-top:3px}
.day-plan{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #282e36}.day-plan:last-child{border-bottom:0}.day-plan .code{width:42px;height:42px;font-size:14px}.plan-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.mini{border:1px solid #353d47;background:#20252c;color:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:800}.mini.good{background:#173321;color:#7fe19e}.mini.danger{background:#3b191d;color:#ff8d93}
.statusline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.statusdot{width:10px;height:10px;border-radius:50%;background:#7d8794}.statusdot.good{background:var(--good)}.statusdot.warn{background:var(--warn)}.statusdot.danger{background:var(--danger)}
.progressline{height:8px;background:#272c33;border-radius:9px;overflow:hidden}.progressline span{display:block;height:100%;background:var(--good)}


.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week-day{min-height:105px;border:1px solid #292f36;background:#101318;border-radius:13px;padding:8px;cursor:pointer}.week-day.today{border-color:var(--accent)}.week-day.selected{background:#1d232a}.week-day>strong{display:block;font-size:20px;margin:4px 0 7px}
.year-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.year-card{background:#101318;color:var(--text);border:1px solid #2b3139;border-radius:14px;padding:12px;text-align:left}.year-card strong{text-transform:capitalize}.year-counts{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px;font-size:11px;color:var(--muted)}.year-counts .runtext{color:#79adff}
.run-plan-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #282e36}.run-plan-row:last-child{border-bottom:0}
.backdate-bar{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:end}.backdate-bar label{margin-top:0}.past-badge{background:#302717;color:#ffd18b}.selected-date-card{scroll-margin-top:84px}.date-action{margin-top:10px}
@media(max-width:620px){.week-grid{grid-template-columns:repeat(7,minmax(42px,1fr));overflow-x:auto}.week-day{min-width:42px;padding:6px}.week-day .dot{display:block;margin-bottom:3px}.year-grid{grid-template-columns:1fr 1fr}}

@media(max-width:380px){.nav-btn small{font-size:8px}.bottom-nav{padding-left:0;padding-right:0}.day{min-height:66px;padding:5px}.dot{font-size:8px}.set-grid{grid-template-columns:24px 48px 1fr 1fr 42px 36px}.refcell{font-size:9px;padding:3px}}
@media(min-width:650px){.metric-grid{grid-template-columns:repeat(4,1fr)}.action-grid{grid-template-columns:repeat(3,1fr)}.day{min-height:92px}}

  
.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.choice-btn{border:1px solid #303741;background:#111419;color:var(--text);border-radius:16px;padding:14px 8px;text-align:center}
.choice-btn .code{margin:0 auto 8px}.choice-btn strong{display:block;font-size:13px}.choice-btn small{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.25}
.month-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.summary-chip{background:#101318;border:1px solid #282f37;border-radius:12px;padding:9px;text-align:center}.summary-chip strong{display:block;font-size:18px}.summary-chip span{font-size:10px;color:var(--muted)}
.interval-box{background:#101318;border:1px solid #2b323a;border-radius:16px;padding:14px;margin:12px 0}.interval-count{font-size:28px;font-weight:950}.interval-note{font-size:12px;color:var(--muted);margin-top:4px}.run-fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.session-line{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #282e36}.session-line:last-child{border-bottom:0}.session-line .code{width:46px;height:46px}
.code.easy{background:#153121;color:#7fe19e}.code.free{background:#2a2037;color:#c7a8ff}
.hr-ok{color:#72e99a}.hr-high{color:#ff8d93}
@media(max-width:460px){.choice-grid{grid-template-columns:repeat(2,1fr)}.month-summary{grid-template-columns:repeat(2,1fr)}.run-fields{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">COACH MANUEL · V3.3.2</div>
        <h1>Force + Course</h1>
      </div>
      <button id="installBtn" class="ghost hidden">Installer</button>
    </header>
    <main id="view"><section class="card"><p class="muted">Chargement…</p></section></main>

  <dialog id="quickDialog"><div id="quickDialogContent"></div></dialog>
<script>
const APP_VERSION="3.3.2";
const STORE="coach10k_force_v2"; // même clé : conserve l'historique et les références muscu
const LIBRARY_VERSION=8;

function clone(x){return JSON.parse(JSON.stringify(x))}
function uid(){return (crypto.randomUUID?crypto.randomUUID():`${Date.now()}_${Math.random().toString(16).slice(2)}`)}
function pad(n){return String(n).padStart(2,"0")}
function dateKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseDateKey(k){const [y,m,d]=String(k).split("-").map(Number);return new Date(y,m-1,d,12,0,0)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function startOfWeek(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(12,0,0,0);return x}
function monthTitle(d){return d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}
function fmtDate(isoOrKey){const d=String(isoOrKey).length===10?parseDateKey(isoOrKey):new Date(isoOrKey);return d.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"short"})}
function fmtLongDate(k){return parseDateKey(k).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function historyDateKey(h){return h.dateKey||dateKey(new Date(h.date))}
function isFutureKey(k){return parseDateKey(k).getTime()>parseDateKey(todayKey()).getTime()}
function isPastKey(k){return parseDateKey(k).getTime()<parseDateKey(todayKey()).getTime()}
function num(v){const x=+v;return isFinite(x)?x:0}
function avg(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null}
function parseDurationInput(v){const t=String(v??"").trim();if(!t)return 0;if(/^\d+(?:[.,]\d+)?$/.test(t))return Math.round(parseFloat(t.replace(",","."))*60);const parts=t.split(":").map(x=>x.trim());if(parts.length===2&&parts.every(x=>/^\d+$/.test(x)))return (+parts[0])*60+(+parts[1]);if(parts.length===3&&parts.every(x=>/^\d+$/.test(x)))return (+parts[0])*3600+(+parts[1])*60+(+parts[2]);return 0}
function durationTextFromSec(sec){sec=Math.max(0,Math.round(num(sec)));if(!sec)return "—";const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h?`${h}:${pad(m)}:${pad(s)}`:`${m}:${pad(s)}`}
function durationLabel(h){if(num(h?.durationSec)>0)return durationTextFromSec(h.durationSec);if(num(h?.duration)>0){const sec=Math.round(num(h.duration)*60);return sec%60===0?`${Math.round(num(h.duration))} min`:durationTextFromSec(sec)}return "—"}
function paceFromRun(h){const km=num(h?.run?.distance),sec=num(h?.durationSec)||num(h?.duration)*60;if(!km||!sec)return "";const p=sec/km,m=Math.floor(p/60),s=Math.round(p%60);return `${m}:${pad(s)}/km`}
function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

const LEGACY_A_REFERENCE={
  code:"A",type:"strength",title:"Muscu A — séance de référence",duration:55,
  goal:"Force / entretien — séance validée",note:"Les dernières charges et répétitions enregistrées servent automatiquement de référence.",
  exercises:[
    {name:"Développé couché",sets:4,reps:"5-6",rest:120,increment:2.5},
    {name:"Tirage vertical",sets:4,reps:"6-8",rest:105,increment:2.5},
    {name:"Rowing poulie ou barre",sets:3,reps:"8",rest:90,increment:2.5},
    {name:"Développé épaules",sets:3,reps:"6-8",rest:90,increment:2.5},
    {name:"Curl biceps",sets:2,reps:"10",rest:60,increment:1},
    {name:"Extension triceps",sets:2,reps:"10",rest:60,increment:1}
  ]
};
const DEFAULT_B={
  code:"B",type:"strength",title:"Muscu B — pectoraux / épaules / triceps",duration:55,goal:"Force et entretien du haut du corps",
  note:"Séance B validée. Pas d’échec : garde une exécution propre et une respiration continue sous charge.",
  exercises:[
    {name:"Développé couché",sets:4,reps:"8",rest:150,increment:2.5,note:"Référence : 58 kg · 10/10/7/7. Consolider avant de monter.",referenceSets:[{kg:58,reps:"10",done:true},{kg:58,reps:"10",done:true},{kg:58,reps:"7",done:true},{kg:58,reps:"7",done:true}]},
    {name:"Développé incliné",sets:3,reps:"8-10",rest:90,increment:2.5,note:"Référence : 38 kg · 8/8/8.",referenceSets:[{kg:38,reps:"8",done:true},{kg:38,reps:"8",done:true},{kg:38,reps:"8",done:true}]},
    {name:"Développé épaules assis barre devant",sets:3,reps:"8-10",rest:90,increment:2.5,note:"Barre devant la tête, dossier assez vertical. Référence : 28 kg · 10/10/10.",referenceSets:[{kg:28,reps:"10",done:true},{kg:28,reps:"10",done:true},{kg:28,reps:"10",done:true}]},
    {name:"Écartés à la poulie",sets:3,reps:"10-12",rest:60,increment:1,note:"Debout, poulies mi-hauteur, mains vers le sternum. Machine : cran 12. Référence : 20 kg · 10/10/10.",referenceSets:[{kg:20,reps:"10",done:true},{kg:20,reps:"10",done:true},{kg:20,reps:"10",done:true}]},
    {name:"Push-down triceps poulie",sets:3,reps:"10-12",rest:75,increment:1,note:"Coudes fixes. Référence : 20 kg · 10/10/10.",referenceSets:[{kg:20,reps:"10",done:true},{kg:20,reps:"10",done:true},{kg:20,reps:"10",done:true}]},
    {name:"Extension triceps au-dessus de la tête",sets:3,reps:"12-15",rest:60,increment:1,note:"Référence : 15 kg · 15/15/15.",referenceSets:[{kg:15,reps:"15",done:true},{kg:15,reps:"15",done:true},{kg:15,reps:"15",done:true}]}
  ]

function isV310DefaultA(s){if(!s||s.code!=="A"||!Array.isArray(s.exercises))return false;const names=s.exercises.map(e=>e.name);const v=["Tirage vertical","Rowing poulie ou barre","Rowing unilatéral poulie","Face pull","Curl biceps","Curl marteau"];return names.length===v.length&&v.every((n,i)=>names[i]===n)}
function aFromHistory(parsed,oldA){
  const hist=(Array.isArray(parsed?.history)?parsed.history:[]).filter(h=>h&&h.code==="A"&&h.strength&&Object.keys(h.strength).length).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
  if(!hist.length)return null;const h=hist[0],names=Object.keys(h.strength||{});if(!names.length)return null;
  const catalogs=[...(oldA?.exercises||[]),...LEGACY_A_REFERENCE.exercises];
  const ex=names.map(name=>{const known=catalogs.find(e=>e.name===name)||{};const sets=Array.isArray(h.strength[name])?h.strength[name]:[];const done=sets.filter(x=>x&&x.done);const lastRep=(done[done.length-1]?.reps??sets[sets.length-1]?.reps??"");return {name,sets:sets.length||known.sets||3,reps:String(lastRep||known.reps||"8"),rest:known.rest||90,increment:known.increment||2.5,note:known.note||""}});
  return Object.assign({},clone(LEGACY_A_REFERENCE),oldA||{},{code:"A",type:"strength",exercises:ex});
}
function normalizeState(parsed){
  const base=clone(defaults);if(!parsed||typeof parsed!=="object")return base;
  base.settings=Object.assign({},base.settings,parsed.settings||{});base.settings.hrEfMax=num(base.settings.hrEfMax)||140;
  base.history=Array.isArray(parsed.history)?parsed.history:[];base.updatedAt=parsed.updatedAt||base.updatedAt;
  const olds=Array.isArray(parsed.sessions)?parsed.sessions:[];
  ["A","B","C"].forEach(code=>{const idx=base.sessions.findIndex(s=>s.code===code),d=base.sessions[idx],old=olds.find(s=>s.code===code);if(!old)return;
    if(code==="A"){const from=aFromHistory(parsed,old);if(from)base.sessions[idx]=from;else if(old&&isV310DefaultA(old))base.sessions[idx]=clone(LEGACY_A_REFERENCE);else if(Array.isArray(old.exercises)&&old.exercises.length)base.sessions[idx]=Object.assign({},d,old,{code:"A",type:"strength",exercises:old.exercises});return;}
    if(code==="B"&&num(parsed.libraryVersion)<6){base.sessions[idx]=clone(DEFAULT_B);return;}
    if(Array.isArray(old.exercises)&&old.exercises.length)base.sessions[idx]=Object.assign({},d,old,{code,type:"strength",exercises:old.exercises});
  });

}

  <div class="section-title"><h2>Records musculation</h2><span class="small">poids maximal enregistré</span></div><section class="card">${records.map(r=>`<div class="record-row"><div><strong>${esc(r.name)}</strong><div class="small">${r.date?`${esc(r.code)} · ${esc(fmtDate(r.date))}`:"Aucun poids enregistré"}</div></div><div class="record-weight">${r.kg!=null?`${r.kg} kg`:"—"}</div></div>`).join("")}</section>`}

function renderSettings(){view.innerHTML=`<div class="section-title"><h2>Réglages & données</h2></div><section class="card"><h3>Endurance fondamentale E</h3><label>FC moyenne maximale de référence (bpm)</label><input id="hrEfMax" type="number" min="80" max="200" value="${state.settings.hrEfMax}"><button class="primary full" style="margin-top:12px" onclick="saveHrSetting()">Enregistrer</button></section>
  <section class="card"><h3>Séances muscu</h3><p class="small">Tu peux modifier A, B ou C. L'historique reste conservé.</p><div class="action-grid"><button class="secondary" onclick="editStrength('A')">Modifier A</button><button class="secondary" onclick="editStrength('B')">Modifier B</button><button class="secondary" onclick="editStrength('C')">Modifier C</button></div></section>
  <section class="card"><h3>Fonctionnement</h3><div class="notice good">Aucun planning automatique. Le calendrier reste vide tant que tu n'as rien saisi. A/B/C = muscu, D = fractionné, E = endurance fondamentale, F = course libre. Maximum 1 course par jour ; la muscu peut être ajoutée plusieurs fois. La saisie a posteriori est autorisée depuis le calendrier, Muscu ou Course.</div></section>
  <section class="card"><h3>Sauvegarde</h3><div class="action-grid"><button class="secondary" onclick="exportData()">Exporter JSON</button><label class="secondary" style="text-align:center;margin:0">Importer JSON<input id="importFile" type="file" accept="application/json" onchange="importData(this.files[0])" style="display:none"></label><button class="ghost" onclick="clearCaches()">Forcer mise à jour</button></div><div class="small" style="margin-top:10px">Version ${APP_VERSION} · données stockées sur cet appareil.</div></section>
  <section class="card"><h3>Règles d'entraînement</h3><div class="notice">Pas de 1RM ni de répétitions forcées. Garde une respiration continue sous charge. Les consignes de ton équipe médicale priment sur l'app et tu arrêtes l'effort en cas de symptôme inhabituel.</div></section>`}
function saveHrSetting(){state.settings.hrEfMax=Math.max(80,Math.min(200,num(document.getElementById("hrEfMax").value)||140));const e=sessionBy("E");if(e?.run)e.run.hrMax=state.settings.hrEfMax;save();render()}

let workoutDraft=null,restTimer=null,restRemaining=0,restOnDone=null,workoutTimer=null,workoutStart=0,dCompleted=0,dRecoveryActive=false;
function openSession(code,k=todayKey()){const s=sessionBy(code);if(!s)return;if(isFutureKey(k)){alert("Pas de planification en avance : choisis aujourd’hui ou une date passée.");return}if(s.type==="run"&&hasRunOn(k)){alert("Une course est déjà enregistrée ce jour. Maximum : 1 séance course par jour.");return}workoutDraft={code,dateKey:k,backdated:isPastKey(k)};workoutStart=Date.now();restRemaining=0;restOnDone=null;dCompleted=0;dRecoveryActive=false;if(s.type==="strength")openStrengthSession(s,k);else openRunSession(s,k);sessionDialog.showModal();if(!workoutDraft.backdated)startWorkoutClock()}
function openStrengthSession(s,k){document.getElementById("sessionDialogContent").innerHTML=`<div class="dialog-inner"><div class="dialog-head"><div><div class="small">${s.code} · MUSCULATION · ${esc(fmtDate(k))}</div><h2 style="margin:0">${esc(s.title)}</h2></div><button class="close" onclick="closeSession()">×</button></div><div class="row between"><span id="elapsedBox" class="elapsed">${workoutDraft.backdated?"Saisie passée":"00:00"}</span><span class="badge ${workoutDraft.backdated?"past-badge":""}">${workoutDraft.backdated?"a posteriori":`objectif ≤ ${state.settings.maxSessionMin||60} min`}</span></div><div class="backdate-bar date-action"><div><label>Date enregistrée</label><input id="sessionDate" type="date" max="${todayKey()}" value="${k}" onchange="changeWorkoutDate(this.value)"></div></div><div id="timerBox"></div><div class="notice">${workoutDraft.backdated?"Saisie a posteriori : entre les charges, reps et la durée réellement faites. ":""}${esc(s.note||"")}</div>${s.exercises.map((e,ei)=>exerciseHTML(s,e,ei)).join("")}<div class="form-grid"><div><label>RPE séance 1–10</label><input id="workRpe" type="number" min="1" max="10" step=".5" value="7"></div><div><label>Durée (min)</label><input id="workDuration" type="number" value="${workoutDraft.backdated?s.duration:""}" placeholder="auto si aujourd'hui"></div></div><label>Notes</label><textarea id="workNotes" placeholder="Technique, sensations, réglages…"></textarea><button class="primary full" style="margin-top:14px" onclick="finishStrength()">Enregistrer la séance</button></div>`}
function lastExerciseSets(code,name,beforeKey=workoutDraft?.dateKey||null){const items=state.history.filter(h=>h.code===code&&h.strength?.[name]&&(!beforeKey||historyDateKey(h)<=beforeKey)).sort((a,b)=>new Date(b.date)-new Date(a.date));const last=items[0];return last?last.strength[name]:null}
function parseRepNumber(v){const m=String(v??"").match(/\d+/);return m?+m[0]:0}
function targetRepHigh(txt){const nums=(String(txt).match(/\d+/g)||[]).map(Number);return nums.length?Math.max(...nums):0}
function isTimedExercise(e){return e?.unit==="min"||/(gainage|planche|plank)/i.test(e?.name||"")}
function refSetText(e,x){if(!x||!x.done)return "—";if(isTimedExercise(e))return `${x.kg?`${x.kg}kg/`:""}${x.reps||"—"} min`;return `${x.kg||0}kg×${x.reps||0}`}
function suggestedLoad(code,e){if(isTimedExercise(e))return null;const sets=lastExerciseSets(code,e.name)||e.referenceSets;if(!sets)return null;const done=sets.filter(x=>x.done&&num(x.kg)>0);if(!done.length)return null;const base=done[done.length-1].kg,high=targetRepHigh(e.reps);const ready=done.length>=Math.min(e.sets,2)&&done.every(x=>parseRepNumber(x.reps)>=high&&x.rir!=null&&num(x.rir)>=2);return {kg:ready?num(base)+num(e.increment||2.5):num(base),ready}}
function exerciseHTML(s,e,ei){const history=lastExerciseSets(s.code,e.name),last=history||e.referenceSets||[],timed=isTimedExercise(e),sug=suggestedLoad(s.code,e);const rows=Array.from({length:e.sets},(_,si)=>{const prev=last[si]||last[last.length-1]||{},ref=last[si]?refSetText(e,last[si]):(last.length?refSetText(e,last[last.length-1]):"—");return `<div class="set-grid"><strong>${si+1}</strong><div class="refcell">${esc(ref)}</div><input id="kg_${ei}_${si}" type="number" step=".5" placeholder="kg" value="${prev.kg||""}"><input id="reps_${ei}_${si}" ${timed?'type="number" step=".1" inputmode="decimal"':'inputmode="numeric"'} placeholder="${timed?'min':esc(e.reps)}" value="${prev.reps||""}"><input id="rir_${ei}_${si}" type="number" min="0" max="5" step="1" placeholder="RIR"><button class="checkset" id="done_${ei}_${si}" onclick="toggleSet(${ei},${si},${e.rest})">✓</button></div>`}).join("");return `<div class="exercise"><div class="ex-head"><div><div class="ex-title">${esc(e.name)}</div>${e.note?`<div class="previous">${esc(e.note)}</div>`:""}${sug?`<div class="suggestion">Proposition : ${sug.kg} kg · ${sug.ready?"petite progression":"même charge, consolider"}</div>`:""}</div><span class="badge">${e.sets}×${esc(e.reps)}${timed?" min":""}</span></div><div class="small" style="margin-top:7px">Série · Réf · kg · ${timed?"min":"reps"} · RIR · ✓</div>${rows}</div>`}
function toggleSet(ei,si,rest){const btn=document.getElementById(`done_${ei}_${si}`);btn.classList.toggle("done");if(btn.classList.contains("done"))startRest(rest)}
function startRest(sec,onDone=null){clearInterval(restTimer);restOnDone=onDone;restRemaining=Math.max(0,Math.round(num(sec)));paintTimer();restTimer=setInterval(()=>{restRemaining--;paintTimer();if(restRemaining<=0){clearInterval(restTimer);if(navigator.vibrate)navigator.vibrate([120,80,120]);const cb=restOnDone;restOnDone=null;if(cb)cb()}},1000)}
function skipRest(){clearInterval(restTimer);restRemaining=0;paintTimer();const cb=restOnDone;restOnDone=null;if(cb)cb()}
function paintTimer(){const box=document.getElementById("timerBox");if(!box)return;if(restRemaining<=0){box.innerHTML="";return}box.innerHTML=`<div class="timerbar"><div><div class="small">RÉCUPÉRATION</div><div class="timerbig">${Math.floor(restRemaining/60)}:${pad(restRemaining%60)}</div></div><button class="ghost" onclick="skipRest()">Passer</button></div>`}
function changeWorkoutDate(k){if(!k||isFutureKey(k)){alert("Choisis aujourd’hui ou une date passée.");const inp=document.getElementById("sessionDate");if(inp)inp.value=workoutDraft.dateKey;return false}if(sessionBy(workoutDraft.code)?.type==="run"&&historyOn(k).some(h=>h.type==="run")){alert("Une course est déjà enregistrée à cette date.");const inp=document.getElementById("sessionDate");if(inp)inp.value=workoutDraft.dateKey;return false}workoutDraft.dateKey=k;workoutDraft.backdated=isPastKey(k);return true}
function syncWorkoutDate(){const inp=document.getElementById("sessionDate");return !inp||changeWorkoutDate(inp.value)}
function finishStrength(){if(!syncWorkoutDate())return;const s=sessionBy(workoutDraft.code),strength={};s.exercises.forEach((e,ei)=>{strength[e.name]=Array.from({length:e.sets},(_,si)=>({kg:num(document.getElementById(`kg_${ei}_${si}`).value),reps:document.getElementById(`reps_${ei}_${si}`).value||"",rir:document.getElementById(`rir_${ei}_${si}`).value===""?null:num(document.getElementById(`rir_${ei}_${si}`).value),done:document.getElementById(`done_${ei}_${si}`).classList.contains("done")}))});const elapsed=Math.max(1,Math.round((Date.now()-workoutStart)/60000)),manual=num(document.getElementById("workDuration").value),finalDuration=manual||(workoutDraft.backdated?s.duration:elapsed);const h={id:uid(),code:s.code,type:"strength",date:historyTimestampForKey(workoutDraft.dateKey),dateKey:workoutDraft.dateKey,duration:finalDuration,rpe:num(document.getElementById("workRpe").value),notes:document.getElementById("workNotes").value,strength};state.history.push(h);save();closeSession();activeTab="activity";selectedDate=workoutDraft.dateKey;calendarCursor=new Date(parseDateKey(selectedDate).getFullYear(),parseDateKey(selectedDate).getMonth(),1,12);render()}

function lastRunOf(code){return state.history.filter(h=>h.code===code&&h.type==="run").sort((a,b)=>new Date(b.date)-new Date(a.date))[0]}
function openRunSession(s,k){const last=lastRunOf(s.code),r=s.run||{};let body="";if(s.code==="D"){const lr=last?.run||{};body=`<div class="notice">Choisis le nombre de répétitions et la durée d'effort. À chaque validation d'une répétition, le repos se déclenche automatiquement.</div><div class="run-fields"><div><label>Répétitions prévues</label><input id="dReps" type="number" min="1" max="30" value="${lr.plannedReps||r.reps||5}" oninput="updateDStatus()"></div><div><label>Effort par répétition (min)</label><input id="dEffort" type="number" min=".5" max="30" step=".5" value="${lr.effortMin||r.effortMin||4}" oninput="updateDStatus()"></div><div><label>Repos (min)</label><input id="dRecovery" type="number" min="0" max="15" step=".5" value="${lr.recoveryMin||r.recoveryMin||3}" oninput="updateDStatus()"></div><div><label>Répétitions réalisées</label><input id="dCompletedInput" type="number" min="0" max="30" value="0" oninput="syncDCompleted()"></div></div><div id="intervalBox" class="interval-box"></div><div id="timerBox"></div><label>Notes</label><textarea id="runNotes" placeholder="Allure, sensations, terrain…"></textarea><button class="primary full" style="margin-top:14px" onclick="finishRunD()">Enregistrer D</button>`}
  if(s.code==="E"){body=`<div class="notice good">Endurance fondamentale : saisis les kilomètres, le temps exact et la fréquence cardiaque moyenne. Repère : ≤ ${state.settings.hrEfMax} bpm.</div><div class="run-fields"><div><label>Distance (km)</label><input id="eDistance" type="number" min="0" step=".01" placeholder="ex. 9.01"></div><div><label>Temps (mm:ss)</label><input id="eDurationText" inputmode="numeric" placeholder="ex. 51:23"></div><div><label>FC moyenne (bpm)</label><input id="eHr" type="number" min="50" max="220" oninput="paintEfHr()"></div></div><div id="efHrStatus" class="small" style="margin-top:10px"></div><label>Notes</label><textarea id="runNotes" placeholder="Sensations, parcours…"></textarea><button class="primary full" style="margin-top:14px" onclick="finishRunE()">Enregistrer E</button>`}
  if(s.code==="F"){body=`<div class="notice">Course libre / vallonnée : pas de cible de fréquence cardiaque. Tu saisis la distance, et le temps si tu veux le conserver.</div><div class="run-fields"><div><label>Distance (km)</label><input id="fDistance" type="number" min="0" step=".01" placeholder="ex. 10"></div><div><label>Temps (mm:ss, facultatif)</label><input id="fDurationText" inputmode="numeric" placeholder="ex. 1:02:00 ou 62:00"></div></div><label>Notes</label><textarea id="runNotes" placeholder="Vallonné, sensations, parcours…"></textarea><button class="primary full" style="margin-top:14px" onclick="finishRunF()">Enregistrer F</button>`}
  document.getElementById("sessionDialogContent").innerHTML=`<div class="dialog-inner"><div class="dialog-head"><div><div class="small">${s.code} · COURSE · ${esc(fmtDate(k))}</div><h2 style="margin:0">${esc(s.title)}</h2></div><button class="close" onclick="closeSession()">×</button></div><div class="row between"><span id="elapsedBox" class="elapsed">${workoutDraft.backdated?"Saisie passée":"00:00"}</span><span class="badge ${workoutDraft.backdated?"past-badge":s.code==="E"?"good":s.code==="D"?"blue":""}">${workoutDraft.backdated?"a posteriori":esc(s.code)}</span></div><div class="backdate-bar date-action"><div><label>Date enregistrée</label><input id="sessionDate" type="date" max="${todayKey()}" value="${k}" onchange="changeWorkoutDate(this.value)"></div></div>${body}</div>`;setTimeout(()=>{if(s.code==="D")updateDStatus();if(s.code==="E")paintEfHr()},0)}
function syncDCompleted(){dCompleted=Math.max(0,num(document.getElementById("dCompletedInput")?.value));updateDStatus()}
function updateDStatus(){const box=document.getElementById("intervalBox");if(!box)return;const total=Math.max(1,num(document.getElementById("dReps")?.value)||5),eff=num(document.getElementById("dEffort")?.value)||4,rec=num(document.getElementById("dRecovery")?.value)||3;dCompleted=Math.min(dCompleted,total);const next=Math.min(total,dCompleted+1);box.innerHTML=`<div class="row between"><div><div class="small">FRACTIONNÉ</div><div class="interval-count">${dCompleted} / ${total}</div><div class="interval-note">${workoutDraft?.backdated?"Saisie a posteriori : indique directement le nombre de répétitions réalisées.":dCompleted>=total?"Toutes les répétitions sont validées.":`Prochaine : répétition ${next} · ${eff} min`}</div></div><span class="badge blue">repos ${rec} min</span></div>${!workoutDraft?.backdated&&dCompleted<total?(dRecoveryActive?`<button class="secondary full" style="margin-top:12px" disabled>Repos en cours…</button>`:`<button class="primary full" style="margin-top:12px" onclick="completeDRep()">✓ Répétition terminée${dCompleted+1<total?" → lancer le repos":""}</button>`):""}`;const inp=document.getElementById("dCompletedInput");if(inp&&num(inp.value)!==dCompleted)inp.value=dCompleted}
function completeDRep(){const total=Math.max(1,num(document.getElementById("dReps").value)||5);if(dCompleted>=total||dRecoveryActive)return;dCompleted++;document.getElementById("dCompletedInput").value=dCompleted;const rec=num(document.getElementById("dRecovery").value)||3;if(dCompleted<total&&rec>0){dRecoveryActive=true;startRest(Math.round(rec*60),()=>{dRecoveryActive=false;updateDStatus()})}else{clearInterval(restTimer);restRemaining=0;restOnDone=null;paintTimer()}updateDStatus()}
function paintEfHr(){const el=document.getElementById("efHrStatus"),inp=document.getElementById("eHr");if(!el||!inp)return;const hr=num(inp.value),max=num(state.settings.hrEfMax)||140;if(!hr){el.textContent=`Repère : FC moyenne ≤ ${max} bpm.`;el.className="small";return}const ok=hr<=max;el.textContent=ok?`FC moyenne dans le repère : ${hr} ≤ ${max} bpm.`:`FC moyenne au-dessus du repère : ${hr} > ${max} bpm.`;el.className=ok?"small hr-ok":"small hr-high"}
function finishRunD(){if(!syncWorkoutDate())return;const total=Math.max(1,num(document.getElementById("dReps").value)||5),eff=num(document.getElementById("dEffort").value)||4,rec=num(document.getElementById("dRecovery").value)||3,completed=Math.min(total,Math.max(0,num(document.getElementById("dCompletedInput").value)));const estimated=Math.round(completed*eff+Math.max(0,completed-1)*rec);pushRun({id:uid(),code:"D",type:"run",date:historyTimestampForKey(workoutDraft.dateKey),dateKey:workoutDraft.dateKey,duration:estimated,notes:document.getElementById("runNotes").value,run:{plannedReps:total,completedReps:completed,effortMin:eff,recoveryMin:rec}})}
function finishRunE(){if(!syncWorkoutDate())return;const dist=num(document.getElementById("eDistance").value),sec=parseDurationInput(document.getElementById("eDurationText").value),hr=num(document.getElementById("eHr").value);if(!dist||!sec||!hr){alert("Pour E, saisis la distance, le temps et la FC moyenne.");return}pushRun({id:uid(),code:"E",type:"run",date:historyTimestampForKey(workoutDraft.dateKey),dateKey:workoutDraft.dateKey,duration:Math.round(sec/60*100)/100,durationSec:sec,notes:document.getElementById("runNotes").value,run:{distance:dist,avgHr:hr,hrMaxRef:num(state.settings.hrEfMax)||140}})}
function finishRunF(){if(!syncWorkoutDate())return;const dist=num(document.getElementById("fDistance").value),sec=parseDurationInput(document.getElementById("fDurationText").value);if(!dist){alert("Pour F, saisis au moins la distance.");return}pushRun({id:uid(),code:"F",type:"run",date:historyTimestampForKey(workoutDraft.dateKey),dateKey:workoutDraft.dateKey,duration:sec?Math.round(sec/60*100)/100:0,durationSec:sec||0,notes:document.getElementById("runNotes").value,run:{distance:dist}})}
function pushRun(h){if(historyOn(workoutDraft.dateKey).some(x=>x.type==="run")){alert("Une course est déjà enregistrée ce jour.");return}state.history.push(h);save();closeSession();activeTab="activity";selectedDate=workoutDraft.dateKey;calendarCursor=new Date(parseDateKey(selectedDate).getFullYear(),parseDateKey(selectedDate).getMonth(),1,12);render()}
function startWorkoutClock(){clearInterval(workoutTimer);function paint(){const el=document.getElementById("elapsedBox");if(!el)return;const sec=Math.floor((Date.now()-workoutStart)/1000);el.textContent=`${pad(Math.floor(sec/60))}:${pad(sec%60)}`}paint();workoutTimer=setInterval(paint,1000)}
function closeSession(){clearInterval(restTimer);clearInterval(workoutTimer);restRemaining=0;restOnDone=null;dRecoveryActive=false;if(sessionDialog.open)sessionDialog.close()}
function moveHistoryDateDialog(id){const h=state.history.find(x=>x.id===id);if(!h)return;const oldK=historyDateKey(h);document.getElementById("quickDialogContent").innerHTML=`<div class="dialog-inner"><div class="dialog-head"><div><div class="small">${esc(displayCode(h.code))} · ${esc(fmtDate(oldK))}</div><h2 style="margin:0">Corriger la date</h2></div><button class="close" onclick="quickDialog.close()">×</button></div><div class="notice">La séance sera déplacée dans le calendrier sans perdre ses données.</div><label>Bonne date</label><input id="historyMoveDate" type="date" max="${todayKey()}" value="${oldK}"><button class="primary full" style="margin-top:12px" onclick="confirmMoveHistoryDate('${id}')">Enregistrer la date</button></div>`;quickDialog.showModal()}
function confirmMoveHistoryDate(id){const h=state.history.find(x=>x.id===id),k=document.getElementById("historyMoveDate")?.value;if(!h||!k)return;if(isFutureKey(k)){alert("Choisis aujourd’hui ou une date passée.");return}if(h.type==="run"&&historyOn(k).some(x=>x.type==="run"&&x.id!==id)){alert("Une autre course est déjà enregistrée à cette date.");return}h.dateKey=k;h.date=historyTimestampForMovedKey(k,h.date);save();quickDialog.close();selectedDate=k;calendarCursor=new Date(parseDateKey(k).getFullYear(),parseDateKey(k).getMonth(),1,12);activeTab="activity";render()}
function deleteHistory(id){if(confirm("Supprimer cette séance ?")){state.history=state.history.filter(h=>h.id!==id);save();render()}}

function editStrength(code){const S=sessionBy(code);if(!S||S.type!=="strength")return;document.getElementById("quickDialogContent").innerHTML=`<div class="dialog-inner"><div class="dialog-head"><h2 style="margin:0">Modifier ${esc(code)}</h2><button class="close" onclick="quickDialog.close()">×</button></div><p class="small">Un exercice par ligne : Nom | séries | reps | repos en secondes</p><textarea id="strengthEditor" style="min-height:280px">${esc(S.exercises.map(e=>`${e.name} | ${e.sets} | ${e.reps} | ${e.rest}`).join("\n"))}</textarea><button class="primary full" style="margin-top:12px" onclick="saveStrength('${code}')">Enregistrer ${esc(code)}</button></div>`;quickDialog.showModal()}
function saveStrength(code){const S=sessionBy(code);if(!S)return;const old=S.exercises||[],lines=document.getElementById("strengthEditor").value.split("\n").map(x=>x.trim()).filter(Boolean);const ex=lines.map(l=>{const [name,sets,reps,rest]=l.split("|").map(x=>x.trim()),prev=old.find(e=>e.name===name)||{};return {name,sets:num(sets)||3,reps:reps||"8",rest:num(rest)||90,increment:prev.increment||2.5,note:prev.note||"",referenceSets:prev.referenceSets}}).filter(x=>x.name);if(ex.length){S.exercises=ex;save()}quickDialog.close();render()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`coach-force-course-backup-${todayKey()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{state=normalizeState(JSON.parse(r.result));save();alert("Import réussi.");render()}catch(e){alert("Fichier non reconnu.")}};r.readAsText(file)}
async function clearCaches(){if("caches" in window){for(const k of await caches.keys())await caches.delete(k)}if(navigator.serviceWorker?.controller)navigator.serviceWorker.controller.postMessage({type:"SKIP_WAITING"});alert("Cache vidé. Recharge la page.");location.reload(true)}
let deferredPrompt=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("installBtn").classList.remove("hidden")});document.getElementById("installBtn").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById("installBtn").classList.add("hidden")}};if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=3.3.2").catch(()=>{}))}
function boot(){try{render()}catch(err){console.error(err);view.innerHTML=`<section class="card hero"><h2>Réparation nécessaire</h2><p>L'application a rencontré une donnée locale incompatible.</p><button class="primary full" id="repairBtn">Réparer sans supprimer l'historique</button><p class="small">Erreur : ${esc(err?.message||String(err))}</p></section>`;document.getElementById("repairBtn").onclick=()=>{state=normalizeState(state);save();location.reload()}}}
window.addEventListener("error",e=>console.error("APP ERROR",e.error||e.message));boot();
</script>
</body></html>
