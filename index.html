<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Coach 10K + Force</title>
  <link rel="manifest" href="./manifest.webmanifest?v=3.1.0" />

  <style>
:root{
  --bg:#0b0d10;--panel:#14171c;--panel2:#1b1f25;--line:#2a3038;
  --text:#f5f7fa;--muted:#9aa4b2;--accent:#ff8a24;--good:#31c76a;
  --blue:#4d8dff;--purple:#8567ff;--danger:#ff4d55;--warn:#f1c75b;
  --shadow:0 10px 30px rgba(0,0,0,.25)
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;background:linear-gradient(180deg,#0b0d10 78%,rgba(11,13,16,.78));backdrop-filter:blur(10px)}
.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:800}
h1{font-size:24px;margin:2px 0 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.42}
#view{padding:6px 14px 98px;max-width:900px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:var(--shadow)}
.card.soft{background:var(--panel2)}
.hero{padding:18px;background:linear-gradient(135deg,#181d23,#211b17);border-color:#3b3026}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 9px;font-size:12px;font-weight:800;background:#252a31;color:#dfe5ec}
.badge.accent{background:#3a2513;color:#ffb66e}.badge.good{background:#143221;color:#72e99a}.badge.warn{background:#3a2d12;color:#ffd169}.badge.blue{background:#132744;color:#79adff}.badge.danger{background:#3b191d;color:#ff8d93}
.big{font-size:30px;font-weight:900;letter-spacing:-.03em}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.metric{background:#111419;border:1px solid #252b33;border-radius:14px;padding:12px}.metric .v{font-size:22px;font-weight:900}.metric .l{font-size:11px;color:var(--muted);margin-top:3px}
.primary,.secondary,.danger,.ghost{border:0;border-radius:13px;padding:12px 14px;font-weight:850}
.primary{background:var(--accent);color:#121212}.secondary{background:#252b33;color:var(--text)}.danger{background:#3c191d;color:#ff858c}.ghost{background:transparent;border:1px solid var(--line);color:var(--text);padding:9px 12px}
.primary:disabled,.secondary:disabled,.ghost:disabled{opacity:.45;cursor:not-allowed}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.full{width:100%}
.small{font-size:12px;color:var(--muted)}.tiny{font-size:10px;color:var(--muted)}.muted{color:var(--muted)}.accent{color:var(--accent)}
.scorebar{height:9px;border-radius:10px;background:#272c33;overflow:hidden;margin-top:7px}.scorebar>span{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--danger),var(--accent),var(--good))}
.session-card{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}.session-card.clickable{cursor:pointer}
.code{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#282017;color:#ffad5f;font-size:18px;font-weight:950}.code.run{background:#14243e;color:#79aaff}.code.rest{background:#20242a;color:#aab4c0}
.session-card p{margin:3px 0 0;color:var(--muted);font-size:13px}.chev{font-size:24px;color:#707b89}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 8px}.section-title h2{margin:0}
.bottom-nav{position:fixed;z-index:30;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);padding:7px 3px calc(7px + env(safe-area-inset-bottom));background:#101317;border-top:1px solid #272d34}
.nav-btn{background:none;border:0;color:#808a97;display:grid;gap:2px;place-items:center;padding:4px 0;min-width:0}.nav-btn span{font-size:18px}.nav-btn small{font-size:9px;white-space:nowrap}.nav-btn.active{color:var(--accent)}
input,select,textarea{width:100%;background:#0e1115;border:1px solid #303741;color:var(--text);border-radius:12px;padding:11px}textarea{min-height:80px;resize:vertical}
label{display:block;font-size:12px;font-weight:750;color:#c3cbd5;margin:10px 0 5px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exercise{border-top:1px solid #293039;padding:13px 0}.exercise:first-child{border-top:0}.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.ex-title{font-weight:900}.previous{font-size:11px;color:#8e99a7;margin-top:2px}.suggestion{font-size:11px;color:#ffb66e;margin-top:3px}
.set-grid{display:grid;grid-template-columns:32px 1fr 1fr 1fr 44px;gap:6px;align-items:center;margin-top:8px}.set-grid input{padding:9px 6px;text-align:center}.checkset{width:42px;height:42px;border:1px solid #39414b;background:#20252c;color:#fff;border-radius:11px}.checkset.done{background:#183724;color:#65df91;border-color:#245c39}
.timerbar{position:sticky;top:70px;z-index:10;background:#172019;border:1px solid #27472f;border-radius:14px;padding:10px 12px;margin:8px 0;display:flex;align-items:center;justify-content:space-between}.timerbig{font-size:22px;font-weight:950;color:#72e99a}.elapsed{font-size:13px;font-weight:800;color:#d7dee7}
dialog{width:min(720px,calc(100% - 18px));max-height:88vh;overflow:auto;border:1px solid #343b45;border-radius:20px;background:#111419;color:var(--text);padding:0;box-shadow:0 30px 80px rgba(0,0,0,.6)}dialog::backdrop{background:rgba(0,0,0,.72)}
.dialog-inner{padding:17px}.dialog-head{position:sticky;top:0;background:#111419;z-index:4;display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px}.close{width:38px;height:38px;border-radius:50%;border:1px solid #363e47;background:#20252b;color:#fff}
.history-item{padding:12px 0;border-bottom:1px solid #282e36}.history-item:last-child{border-bottom:0}.history-meta{font-size:12px;color:var(--muted);margin-top:3px}
.kpi{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #282e36}.kpi:last-child{border-bottom:0}.kpi strong{font-size:18px}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #282e36}.rank:last-child{border-bottom:0}.ranknum{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#2a2f36;font-size:12px;font-weight:900}
.notice{font-size:12px;line-height:1.45;background:#171b20;border-left:3px solid var(--accent);padding:11px 12px;border-radius:8px}.notice.good{border-left-color:var(--good)}.notice.warn{border-left-color:var(--warn)}.notice.danger{border-left-color:var(--danger)}
.compat{font-size:12px;padding:7px 9px;border-radius:10px;display:inline-block;margin-top:6px}.compat.ok{background:#173321;color:#7fe19e}.compat.mid{background:#352d16;color:#f1cc68}.compat.no{background:#3b191d;color:#ff8d93}
.segment{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#111419;padding:4px;border-radius:13px}.segment button{border:0;background:transparent;color:#a3adba;padding:9px;border-radius:10px;font-weight:850}.segment button.active{background:#2a3038;color:white}

.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}.calendar-title{font-size:18px;font-weight:900;text-transform:capitalize}.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar-weekdays div{text-align:center;font-size:10px;color:var(--muted);font-weight:800;padding:4px 0}
.day{min-height:74px;border:1px solid #292f36;background:#101318;border-radius:12px;padding:6px;position:relative;cursor:pointer;overflow:hidden}.day.other{opacity:.42}.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.day.selected{background:#1d232a}.daynum{font-size:11px;font-weight:850}.daydots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}.dot{font-size:9px;font-weight:900;padding:3px 4px;border-radius:6px;background:#2a3038;color:#d9e0e8}.dot.run{background:#132744;color:#79adff}.dot.strength{background:#3a2513;color:#ffb66e}.dot.done{outline:1px solid #31c76a}.dot.rest{background:#252a31;color:#aab4c0}.daymore{font-size:9px;color:var(--muted);margin-top:3px}
.day-plan{display:grid;grid-template-columns:42px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #282e36}.day-plan:last-child{border-bottom:0}.day-plan .code{width:42px;height:42px;font-size:14px}.plan-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.mini{border:1px solid #353d47;background:#20252c;color:#fff;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:800}.mini.good{background:#173321;color:#7fe19e}.mini.danger{background:#3b191d;color:#ff8d93}
.statusline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.statusdot{width:10px;height:10px;border-radius:50%;background:#7d8794}.statusdot.good{background:var(--good)}.statusdot.warn{background:var(--warn)}.statusdot.danger{background:var(--danger)}
.progressline{height:8px;background:#272c33;border-radius:9px;overflow:hidden}.progressline span{display:block;height:100%;background:var(--good)}


.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week-day{min-height:105px;border:1px solid #292f36;background:#101318;border-radius:13px;padding:8px;cursor:pointer}.week-day.today{border-color:var(--accent)}.week-day.selected{background:#1d232a}.week-day>strong{display:block;font-size:20px;margin:4px 0 7px}
.year-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.year-card{background:#101318;color:var(--text);border:1px solid #2b3139;border-radius:14px;padding:12px;text-align:left}.year-card strong{text-transform:capitalize}.year-counts{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:8px;font-size:11px;color:var(--muted)}.year-counts .runtext{color:#79adff}
.run-plan-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #282e36}.run-plan-row:last-child{border-bottom:0}
@media(max-width:620px){.week-grid{grid-template-columns:repeat(7,minmax(42px,1fr));overflow-x:auto}.week-day{min-width:42px;padding:6px}.week-day .dot{display:block;margin-bottom:3px}.year-grid{grid-template-columns:1fr 1fr}}

@media(max-width:380px){.nav-btn small{font-size:8px}.bottom-nav{padding-left:0;padding-right:0}.day{min-height:66px;padding:5px}.dot{font-size:8px}.set-grid{grid-template-columns:28px 1fr 1fr 1fr 40px}}
@media(min-width:650px){.metric-grid{grid-template-columns:repeat(4,1fr)}.action-grid{grid-template-columns:repeat(3,1fr)}.day{min-height:92px}}

  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">COACH ADAPTATIF · V3.0</div>
        <h1>10K + Force</h1>
      </div>
      <button id="installBtn" class="ghost hidden">Installer</button>
    </header>

    <main id="view">
      <section class="card"><p class="muted">Chargement du coach…</p></section>
    </main>

    <nav class="bottom-nav" aria-label="Navigation">
      <button data-tab="today" class="nav-btn active"><span>◉</span><small>Aujourd’hui</small></button>
      <button data-tab="activity" class="nav-btn"><span>▦</span><small>Activité</small></button>
      <button data-tab="sessions" class="nav-btn"><span>≡</span><small>Muscu</small></button>
      <button data-tab="running" class="nav-btn"><span>⌁</span><small>Course</small></button>
      <button data-tab="stats" class="nav-btn"><span>↗</span><small>Analyse</small></button>
      <button data-tab="settings" class="nav-btn"><span>⚙</span><small>Réglages</small></button>
    </nav>
  </div>

  <dialog id="sessionDialog"><div id="sessionDialogContent"></div></dialog>
  <dialog id="quickDialog"><div id="quickDialogContent"></div></dialog>

  <script>
const APP_VERSION = "3.1.0";
const STORE = "coach10k_force_v2"; // même clé pour conserver les données v2
const LIBRARY_VERSION = 4;

const defaults = {
  libraryVersion: LIBRARY_VERSION,
  settings: {
    target10kSec: 50*60,
    maxSessionMin: 60,
    enduranceScore: 5840,
    climbScore: 40,
    climbEndurance: 17,
    climbPower: 32,
    vo2max: 47,
    readiness: 4,
    legs: 2,
    kneeToday: 0,
    availableMin: 60,
    allowDouble: true,
    runPlanVersion: 1
  },
  sessions: [
    {
      code:"A", type:"strength", title:"Muscu A — dos / biceps", duration:55, hardLegs:false,
      goal:"Force haut du corps / tirage",
      note:"Séance A modifiable. Garde 2–3 répétitions en réserve et une respiration continue.",
      exercises:[
        {name:"Tirage vertical",sets:4,reps:"6-8",rest:105,increment:2.5},
        {name:"Rowing poulie ou barre",sets:4,reps:"8",rest:90,increment:2.5},
        {name:"Rowing unilatéral poulie",sets:3,reps:"8/côté",rest:75,increment:2.5},
        {name:"Face pull",sets:3,reps:"12",rest:60,increment:2.5},
        {name:"Curl biceps",sets:3,reps:"8-10",rest:75,increment:1},
        {name:"Curl marteau",sets:2,reps:"10",rest:60,increment:1}
      ]
    },
    {
      code:"B", type:"strength", title:"Muscu B — pectoraux / épaules / triceps", duration:55, hardLegs:false,
      goal:"Force et entretien du haut du corps",
      note:"Charge modérée, pas d’échec. Vise 2–3 RIR sur les mouvements principaux.",
      exercises:[
        {name:"Développé couché",sets:4,reps:"8",rest:120,increment:2.5},
        {name:"Développé incliné",sets:3,reps:"8-10",rest:90,increment:2.5},
        {name:"Écartés à la poulie",sets:3,reps:"10-12",rest:60,increment:1},
        {name:"Élévations latérales poulie",sets:3,reps:"12",rest:60,increment:1},
        {name:"Extension triceps poulie",sets:3,reps:"10",rest:75,increment:1},
        {name:"Extension triceps au-dessus de la tête",sets:2,reps:"10-12",rest:60,increment:1}
      ]
    },
    {
      code:"C", type:"strength", title:"Muscu C — jambes / tronc", duration:58, hardLegs:true,
      goal:"Force utile à la course, quadriceps, chaîne postérieure et stabilité",
      note:"Squat au banc : 3×8, descente contrôlée ≈3 s, contact léger avec le banc. Ne poursuis pas si la douleur du genou augmente nettement.",
      exercises:[
        {name:"Squat au banc",sets:3,reps:"8",rest:120,increment:2.5},
        {name:"Soulevé de terre roumain",sets:3,reps:"8",rest:105,increment:2.5},
        {name:"Step-up bas",sets:3,reps:"8/jambe",rest:90,increment:1},
        {name:"Leg curl à la poulie",sets:3,reps:"10-12",rest:75,increment:1},
        {name:"Mollets debout",sets:3,reps:"12-15",rest:60,increment:2.5},
        {name:"Pallof press",sets:3,reps:"10/côté",rest:45,increment:1}
      ]
    },
    {code:"R1",type:"run",title:"Endurance fondamentale",duration:45,hardLegs:false,goal:"Base aérobie / récupération",note:"Allure très facile, terrain plat si les genoux sont sensibles. Conversation possible, RPE 3–4.",run:{warmup:0,main:"40–50 min facile",recovery:"",cooldown:""}},
    {code:"R2",type:"run",title:"Fractionné court",duration:48,hardLegs:true,goal:"Vitesse / économie de course",note:"Uniquement si le suivi genou est favorable. Rapide mais contrôlé, jamais sprint maximal.",run:{warmup:14,main:"8 × 1 min rapide",recovery:"1 min lente entre répétitions",cooldown:"10–12 min facile"}},
    {code:"R3",type:"run",title:"Seuil / tempo",duration:52,hardLegs:true,goal:"Tenir un effort soutenu",note:"Difficile mais contrôlé, RPE ≈7. À remplacer par R1 si réaction du genou retardée.",run:{warmup:12,main:"3 × 8 min soutenues",recovery:"2 min faciles",cooldown:"10 min facile"}},
    {code:"R4",type:"run",title:"Spécifique 10 km",duration:52,hardLegs:true,goal:"Rendre 5:00/km durable",note:"Objectif 10 km < 50 min. Ne pas accélérer au-delà du plan pour gagner la séance.",run:{warmup:12,main:"4 × 1 km à 5:00–5:10/km",recovery:"2 min faciles",cooldown:"8–10 min facile"}},
    {code:"R5",type:"run",title:"Côtes",duration:48,hardLegs:true,goal:"Puissance + endurance en montée",note:"À réintroduire lorsque les genoux tolèrent bien le plat. Effort énergique contrôlé, redescente tranquille.",run:{warmup:14,main:"6 × 60–75 s en côte",recovery:"redescente lente ≈2 min",cooldown:"10–12 min facile"}},
    {code:"R6",type:"run",title:"Test / course 10 km",duration:60,hardLegs:true,goal:"Mesurer l’objectif sub-50",note:"À faire uniquement si les deux semaines précédentes ont été bien tolérées et sans réaction retardée importante.",run:{warmup:12,main:"10 km régulier — départ prudent vers 5:05/km puis ajustement",recovery:"",cooldown:"5–10 min très facile"}},
    {code:"R7",type:"run",title:"Fartlek ludique",duration:46,hardLegs:true,goal:"Vitesse sans regarder constamment la montre",note:"À utiliser quand les genoux sont bien tolérés. Les accélérations restent contrôlées, jamais en sprint.",run:{warmup:12,main:"10 × 1 min vive / 1 min facile, au ressenti",recovery:"1 min très facile",cooldown:"10–12 min facile"}},
    {code:"R8",type:"run",title:"Progressive / negative split",duration:50,hardLegs:false,goal:"Endurance + maîtrise d’allure",note:"Départ volontairement lent, puis accélération douce. Si les genoux réagissent, rester intégralement en endurance facile.",run:{warmup:0,main:"20 min faciles + 15 min régulières + 10 min légèrement plus actives",recovery:"",cooldown:"5 min très faciles"}}
  ],
  history: [],
  planned: {},
  planInitialized: false,
  updatedAt: new Date().toISOString()
};

function clone(x){return JSON.parse(JSON.stringify(x))}
function uid(){return (crypto.randomUUID?crypto.randomUUID():`${Date.now()}_${Math.random().toString(16).slice(2)}`)}
function pad(n){return String(n).padStart(2,"0")}
function dateKey(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseDateKey(k){const [y,m,d]=String(k).split("-").map(Number);return new Date(y,m-1,d,12,0,0)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function startOfWeek(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(12,0,0,0);return x}
function nextMonday(d=new Date()){const x=new Date(d);x.setHours(12,0,0,0);const delta=(8-x.getDay())%7;return addDays(x,delta===0?0:delta)}
function monthTitle(d){return d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}
function fmtDate(isoOrKey){const d=String(isoOrKey).length===10?parseDateKey(isoOrKey):new Date(isoOrKey);return d.toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"short"})}
function fmtLongDate(k){return parseDateKey(k).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function historyDateKey(h){return h.dateKey||dateKey(new Date(h.date))}

function normalizePlanEntry(p){
  if(typeof p==="string") return {id:uid(),code:p,status:"planned"};
  if(!p||typeof p!=="object") return null;
  return Object.assign({id:uid(),code:"R1",status:"planned"},p);
}
function normalizePlanned(planned){
  const out={};
  if(!planned||typeof planned!=="object") return out;
  Object.keys(planned).forEach(k=>{
    const arr=Array.isArray(planned[k])?planned[k]:[];
    out[k]=arr.map(normalizePlanEntry).filter(Boolean);
  });
  return out;
}
function normalizeState(parsed){
  const base=clone(defaults);
  if(!parsed||typeof parsed!=="object") return base;
  base.settings=Object.assign({},base.settings,parsed.settings||{});
  base.history=Array.isArray(parsed.history)?parsed.history:[];
  base.planned=normalizePlanned(parsed.planned);
  base.planInitialized=!!parsed.planInitialized || Object.keys(base.planned).length>0;
  base.updatedAt=parsed.updatedAt||base.updatedAt;

  const oldSessions=Array.isArray(parsed.sessions)?parsed.sessions:[];
  if(oldSessions.length){
    // Migration v2/v3 -> v3.1 : conserver les exercices personnalisés A/B/C,
    // puis compléter la bibliothèque running avec les nouvelles variantes ludiques.
    base.sessions=defaults.sessions.map(d=>{
      const old=oldSessions.find(s=>s.code===d.code);
      if(!old)return clone(d);
      if(d.type==="strength"&&Array.isArray(old.exercises)&&old.exercises.length){
        return Object.assign({},d,old,{code:d.code,type:"strength",hardLegs:d.hardLegs,exercises:old.exercises});
      }
      return Object.assign({},d,old,{code:d.code,type:d.type,hardLegs:d.hardLegs});
    });
  }
  base.settings.runPlanVersion=num(parsed.settings?.runPlanVersion||0);
  base.libraryVersion=LIBRARY_VERSION;
  return base;
}
function load(){
  try{const raw=localStorage.getItem(STORE);return raw?normalizeState(JSON.parse(raw)):clone(defaults)}catch(e){return clone(defaults)}
}

function ensureStarterPlan(){

  const start=nextMonday(new Date());
  starterWeeks().forEach((week,wi)=>week.forEach((entry,di)=>{
    const k=dateKey(addDays(start,wi*7+di));
    state.planned[k]=state.planned[k]||[];
    state.planned[k].push(entry);
  }));
  state.planInitialized=true;save();
}

function ensureRunningPlanV1(){
  if(num(state.settings.runPlanVersion)>=1)return;
  const start=nextMonday(new Date()), weeks=starterWeeks();
  // On conserve A/B/C, repos et séances déjà effectuées ; seuls les D futurs planifiés sont renouvelés.
  Object.keys(state.planned).forEach(k=>{
    if(k>=dateKey(start))state.planned[k]=(state.planned[k]||[]).filter(p=>p.status==="done"||!isRunCode(p.code));
  });
  weeks.forEach((week,wi)=>week.forEach((entry,di)=>{
    if(!isRunCode(entry.code))return;
    const k=dateKey(addDays(start,wi*7+di));state.planned[k]=state.planned[k]||[];state.planned[k].push(entry);
  }));
  state.settings.runPlanVersion=1;save();
}

function kneeStatus(){
  const today=num(state.settings.kneeToday);
  const runs=state.history.filter(h=>h.run&&daysAgo(h.date)<=14).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const values=[];
  runs.slice(0,4).forEach(h=>{
    const k=h.run.knee||{};
    [k.start,k.after2k,k.oneHour,k.nextMorning,k.after48h].forEach(v=>{if(v!==""&&v!=null&&isFinite(+v))values.push(+v)});
  });
  const recentFollow=runs.slice(0,3).map(h=>h.run.knee||{});
  const red = today>=4 || recentFollow.some(k=>num(k.oneHour)>=5||num(k.nextMorning)>=4||num(k.after48h)>=3);
  const warn = today>=2.5 || recentFollow.some(k=>num(k.oneHour)>=3||num(k.nextMorning)>=2||num(k.after48h)>=2);
  const complete=recentFollow.filter(k=>k.oneHour!=null&&k.nextMorning!=null);
  const green = today<=1 && complete.length>=2 && complete.every(k=>num(k.oneHour)<=2&&num(k.nextMorning)<=1&&(k.after48h==null||num(k.after48h)<=1));
  if(red)return {level:"danger",label:"Genou rouge",text:"Réaction élevée : évite aujourd’hui les séances de course rapides et les grosses charges jambes."};
  if(warn)return {level:"warn",label:"Genou orange",text:"Tolérance encore limite : privilégie facile/plat et garde les séances dures en attente."};
  if(green)return {level:"good",label:"Genou vert",text:"Les dernières sorties semblent bien tolérées : progression prudente possible."};
  return {level:"mid",label:"Genou à suivre",text:values.length?"Données partielles : complète le suivi 1 h / lendemain pour fiabiliser le planning.":"Pas encore assez de données post-course pour valider les séances rapides."};
}

function weaknessModel(){
  const s=state.settings;
  const r4=lastOf("R4"), r6=lastOf("R6");
  const pace=(r6&&r6.run?.paceSec)||(r4&&r4.run?.paceSec)||null;
  const tenKNeed=pace?Math.max(0,Math.min(100,(pace-300)*2+35)):55;
  const enduranceNeed=Math.max(20,Math.min(95,70-Math.min(30,recent("R1",10).length*12)));
  return [
    {key:"climbEndurance",label:"Endurance en montée",need:Math.max(0,100-num(s.climbEndurance)),detail:`Garmin ${s.climbEndurance}`},
    {key:"climbPower",label:"Puissance en montée",need:Math.max(0,100-num(s.climbPower)),detail:`Garmin ${s.climbPower}`},
    {key:"10k",label:"Spécifique 10 km",need:tenKNeed,detail:pace?`Dernière allure spécifique ${secToPace(pace)}`:"Pas encore assez de données spécifiques"},
    {key:"aerobic",label:"Endurance fondamentale",need:enduranceNeed,detail:`${recent("R1",10).length+recent("R8",10).length} D faciles/progressives sur 10 jours`}
  ].sort((a,b)=>b.need-a.need);
}
function scoreSession(code){
  const s=state.settings, weak=weaknessModel(), top=weak[0]?.key;
  const knee=kneeStatus();
  let score=50,reasons=[];
  const hDays=lastHardDays(),legs=num(s.legs),readiness=num(s.readiness),sess=sessionBy(code);
  if(code==="R5"){score+=(100-num(s.climbEndurance))*.25+(100-num(s.climbPower))*.2;reasons.push("cible la montée")}
  if(code==="C"){score+=(100-num(s.climbPower))*.18;reasons.push("renforce les jambes et la stabilité")}
  if(code==="R4"||code==="R6"){score+=top==="10k"?32:16;reasons.push("spécifique à l’objectif 5:00/km")}
  if(code==="R3"){score+=top==="10k"?26:12;reasons.push("développe la tenue d’allure")}
  if(code==="R2"||code==="R7"){score+=12;reasons.push(code==="R7"?"apporte de la vitesse avec un format ludique":"travaille vitesse et économie") }
  if(code==="R1"||code==="R8"){score+=20+(hDays<1.5?24:0)+(legs>=4?20:0);reasons.push(code==="R8"?"développe l’endurance avec une allure progressive":"favorise récupération et base aérobie") }
  if(code==="A"||code==="B"){score+=14+(hDays<1.2?16:0);reasons.push("entretient la force sans grosse contrainte jambes")}
  if(sess?.hardLegs&&hDays<1.25){score-=50;reasons.push("forte charge jambes récente")}
  if(sess?.hardLegs&&legs>=4){score-=40;reasons.push("jambes fatiguées")}
  if(sess?.hardLegs&&readiness<=2){score-=35;reasons.push("récupération basse")}
  if(hardLast(7)>=3&&sess?.hardLegs){score-=25;reasons.push("déjà beaucoup de séances exigeantes")}
  const last=lastOf(code);if(last&&daysAgo(last.date)<2.5){score-=22;reasons.push("séance identique récente")}
  if(sess?.duration>num(s.availableMin)){score-=80;reasons.push("dépasse le temps disponible")}
  if(knee.level==="danger"){
    if(sess?.type==="run") score-=code==="R1"?30:100;
    if(code==="C")score-=85;
  }else if(knee.level==="warn"){
    if(sess?.hardLegs&&sess?.type==="run")score-=70;
    if(code==="C")score-=35;
  }
  return {code,score,reasons};
}
function recommendation(){return state.sessions.map(x=>scoreSession(x.code)).sort((a,b)=>b.score-a.score)}
function compat(a,b){
  const A=sessionBy(a),B=sessionBy(b);if(!A||!B)return {lvl:"mid",txt:"À évaluer"};
  if(a===b)return {lvl:"no",txt:"Même séance"};
  if(A.hardLegs&&B.hardLegs)return {lvl:"no",txt:"Deux fortes charges jambes"};
  if((A.code==="C"&&B.type==="run")||(B.code==="C"&&A.type==="run")){
    if(A.code==="R1"||B.code==="R1")return {lvl:"mid",txt:"Possible seulement très facile et bien récupéré"};
    return {lvl:"no",txt:"À éviter le même jour"};
  }
  if((A.type==="strength"&&!A.hardLegs&&B.code==="R1")||(B.type==="strength"&&!B.hardLegs&&A.code==="R1"))return {lvl:"ok",txt:"Bon doublé"};
  if(A.hardLegs||B.hardLegs)return {lvl:"mid",txt:"Possible avec plusieurs heures d’écart"};
  return {lvl:"ok",txt:"Compatible"};
}

function todayDecision(){
  const k=todayKey();const p=firstActivePlan(k);const knee=kneeStatus();
  if(p){
    if(p.code==="REST")return {rest:true,plan:p,reason:p.note||"Journée de récupération prévue au calendrier."};
    const s=sessionBy(p.code);
    if(s&&(s.hardLegs||s.type==="run")&&knee.level==="danger"){
      const safe=recommendation().find(r=>["A","B"].includes(r.code))||recommendation()[0];
      return {code:safe.code,plan:p,overridden:true,reason:`${displayCode(p.code)} était prévu, mais ${knee.label.toLowerCase()} : proposition plus prudente aujourd’hui.`};
    }
    if(s?.hardLegs&&s.type==="run"&&knee.level==="warn"){
      return {code:"R1",plan:p,overridden:true,reason:`${displayCode(p.code)} était prévu, mais le suivi genou est orange : une D facile est proposée à la place.`};
    }
    return {code:p.code,plan:p,reason:`Séance prévue au planning aujourd’hui${p.note?` : ${p.note}`:"."}`};
  }
  const best=recommendation()[0];return {code:best.code,reason:best.reasons[0]||"meilleur compromis selon les données enregistrées"};
}

  return `<div class="section-title"><h2>Dernières activités</h2><span class="small">détail conservé dans les stats</span></div><section class="card">${hs.length?hs.map(h=>`<div class="kpi"><div><strong>${esc(fmtDate(historyDateKey(h)))} · ${esc(displayCode(h.code))}</strong><div class="small">${h.type==="run"?esc(runVariantLabel(h.code)):esc(sessionBy(h.code)?.title||"")}${h.duration?` · ${h.duration} min`:""}</div></div><span class="badge good">✓</span></div>`).join(""):`<p class="muted">Aucune activité enregistrée.</p>`}</section>`;
}
function renderActivityMonth(){
  const first=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth(),1,12),gridStart=startOfWeek(first),days=Array.from({length:42},(_,i)=>addDays(gridStart,i));

}

}
function weekActivityDay(d){const k=dateKey(d),codes=activityCodesOn(k);return `<div class="week-day ${k===todayKey()?"today":""} ${k===selectedDate?"selected":""}" onclick="selectCalendarDay('${k}')"><div class="small">${d.toLocaleDateString('fr-FR',{weekday:'short'})}</div><strong>${d.getDate()}</strong><div class="daydots">${codes.map(x=>`<span class="dot ${x.type==="run"?"run":"strength"} ${x.done?"done":""}">${esc(x.code)}</span>`).join("")||`<span class="tiny">—</span>`}</div></div>`}
function moveActivityWeek(n){selectedDate=dateKey(addDays(startOfWeek(parseDateKey(selectedDate)),n*7));calendarCursor=new Date(parseDateKey(selectedDate).getFullYear(),parseDateKey(selectedDate).getMonth(),1,12);render()}
function renderActivityYear(){
  const y=calendarCursor.getFullYear();
  const cards=Array.from({length:12},(_,m)=>yearMonthCard(y,m)).join("");
  view.innerHTML=`<div class="section-title"><div><h2>Activité</h2><div class="small">Vue annuelle A/B/C/D</div></div><span class="badge">${y}</span></div>${activitySegments()}<section class="card"><div class="calendar-head"><button class="ghost" onclick="moveActivityYear(-1)">‹</button><div class="calendar-title">${y}</div><button class="ghost" onclick="moveActivityYear(1)">›</button></div>${activityLegend()}<div class="year-grid" style="margin-top:12px">${cards}</div></section>${activityHistorySummary()}`;
}
function yearMonthCard(y,m){
  const start=new Date(y,m,1,12),end=new Date(y,m+1,0,12),counts={A:0,B:0,C:0,D:0},done={A:0,B:0,C:0,D:0};
  for(let d=new Date(start);d<=end;d=addDays(d,1)){activityCodesOn(dateKey(d)).forEach(x=>{counts[x.code]=(counts[x.code]||0)+1;if(x.done)done[x.code]=(done[x.code]||0)+1})}
  return `<button class="year-card" onclick="openActivityMonth(${y},${m})"><strong>${start.toLocaleDateString('fr-FR',{month:'short'})}</strong><div class="year-counts"><span>A ${done.A}/${counts.A}</span><span>B ${done.B}/${counts.B}</span><span>C ${done.C}/${counts.C}</span><span class="runtext">D ${done.D}/${counts.D}</span></div></button>`;
}
function moveActivityYear(n){calendarCursor=new Date(calendarCursor.getFullYear()+n,calendarCursor.getMonth(),1,12);render()}
function openActivityMonth(y,m){calendarCursor=new Date(y,m,1,12);selectedDate=dateKey(new Date(y,m,1,12));activityMode="month";render()}

function calendarDay(d,currentMonth){
  const k=dateKey(d),codes=activityCodesOn(k);
  const cls=["day",d.getMonth()!==currentMonth?"other":"",k===todayKey()?"today":"",k===selectedDate?"selected":""].filter(Boolean).join(" ");
  return `<div class="${cls}" onclick="selectCalendarDay('${k}')"><div class="daynum">${d.getDate()}</div><div class="daydots">${codes.slice(0,3).map(x=>`<span class="dot ${x.type==="run"?"run":x.type==="strength"?"strength":"rest"} ${x.done?"done":""}">${esc(x.code)}</span>`).join("")}</div>${codes.length>3?`<div class="daymore">+${codes.length-3}</div>`:""}</div>`;
}
function renderDayDetail(k){
  const plans=plansOn(k),hs=historyOn(k),isFuture=k>todayKey();
  return `<div class="section-title"><div><div class="small">${esc(fmtLongDate(k))}</div><h2>Détail du jour</h2></div><button class="primary" onclick="chooseSession(false,'${k}',true)">+ Planifier</button></div>
  <section class="card"><h3>Prévu</h3>${plans.length?plans.map(p=>planRow(p,k,isFuture)).join(""):`<p class="muted">Aucune séance prévue.</p>`}</section>
  <section class="card"><h3>Effectué</h3>${hs.length?hs.map(h=>historyCompact(h)).join(""):`<p class="muted">Aucune séance enregistrée ce jour.</p>`}</section>`;
}
function planRow(p,k,isFuture=k>todayKey()){
  const s=p.code==="REST"?null:sessionBy(p.code);const type=s?.type||"rest";const done=p.status==="done";
  return `<div class="day-plan"><div class="code ${type==="run"?"run":type==="rest"?"rest":""}">${esc(displayCode(p.code))}</div><div><strong>${esc(planTitle(p))}</strong><div class="small">${done?"Effectué":p.status==="skipped"?"Sauté":"Prévu"}${p.plannedDuration?` · ${p.plannedDuration} min`:""}${p.runMain?` · ${esc(p.runMain)}`:""}</div>${p.note?`<div class="tiny">${esc(p.note)}</div>`:""}</div><div class="plan-actions">${p.code!=="REST"&&!done?`<button class="mini good" ${isFuture?"disabled":""} onclick="event.stopPropagation();openSession('${p.code}','${k}','${p.id}')">${isFuture?"À venir":"Démarrer"}</button>`:""}${!done?`<button class="mini" onclick="event.stopPropagation();movePlanDialog('${k}','${p.id}')">Déplacer</button>`:""}<button class="mini danger" onclick="event.stopPropagation();removePlan('${k}','${p.id}')">×</button></div></div>`;
}
function historyCompact(h){return `<div class="history-item"><div class="row between"><div><strong>${esc(displayCode(h.code))} · ${esc(sessionBy(h.code)?.title||h.title||"")}</strong><div class="history-meta">RPE ${h.rpe||"—"}${h.duration?` · ${h.duration} min`:""}</div></div><span class="badge good">✓</span></div>${h.run?`<div class="small">${h.run.distance?`${h.run.distance} km · `:""}${h.run.paceSec?secToPace(h.run.paceSec):""}${h.run.cadence?` · ${h.run.cadence} ppm`:""}</div>`:""}</div>`}
function moveMonth(n){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+n,1,12);render()}
function goTodayCalendar(){calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1,12);selectedDate=todayKey();render()}
function selectCalendarDay(k){selectedDate=k;calendarCursor=new Date(parseDateKey(k).getFullYear(),parseDateKey(k).getMonth(),1,12);render()}
function addPlanForDate(k,code){
  state.planned[k]=state.planned[k]||[];
  if(code==="REST")state.planned[k].push(makePlan("REST",{title:"Repos / marche"}));else state.planned[k].push(makePlan(code));
  save();quickDialog.close();selectedDate=k;activeTab="activity";render();
}
function removePlan(k,id){if(confirm("Retirer cette entrée du calendrier ?")){state.planned[k]=(state.planned[k]||[]).filter(p=>p.id!==id);if(!state.planned[k].length)delete state.planned[k];save();render()}}
function movePlanDialog(k,id){
  const p=planById(k,id);if(!p)return;
  document.getElementById("quickDialogContent").innerHTML=`<div class="dialog-inner"><div class="dialog-head"><h2 style="margin:0">Déplacer ${esc(p.code)}</h2><button class="close" onclick="quickDialog.close()">×</button></div><label>Nouvelle date</label><input id="moveDate" type="date" value="${k}"><button class="primary full" style="margin-top:12px" onclick="confirmMovePlan('${k}','${id}')">Déplacer</button></div>`;quickDialog.showModal();
}
function confirmMovePlan(oldK,id){
  const newK=document.getElementById("moveDate").value;if(!newK)return;const p=planById(oldK,id);if(!p)return;
  state.planned[oldK]=(state.planned[oldK]||[]).filter(x=>x.id!==id);if(!state.planned[oldK].length)delete state.planned[oldK];
  state.planned[newK]=state.planned[newK]||[];state.planned[newK].push(p);save();quickDialog.close();selectedDate=newK;calendarCursor=new Date(parseDateKey(newK).getFullYear(),parseDateKey(newK).getMonth(),1,12);render();
}

function plannedRunsInMonth(cursor=runCursor){
  const y=cursor.getFullYear(),m=cursor.getMonth(),out=[];
  Object.keys(state.planned).sort().forEach(k=>{const d=parseDateKey(k);if(d.getFullYear()===y&&d.getMonth()===m)plansOn(k).forEach(p=>{if(isRunCode(p.code)&&p.status!=="skipped")out.push({date:k,plan:p})})});
  return out;
}
function nextPlannedRun(){
  const start=parseDateKey(todayKey());
  for(let i=0;i<28;i++){const k=dateKey(addDays(start,i));const p=plansOn(k).find(x=>isRunCode(x.code)&&x.status==="planned");if(p)return {date:k,plan:p}}
  return null;
}
function lastRunCodes(n=3){return state.history.filter(h=>h.type==="run").sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,n).map(h=>h.code)}
function runningCoachAdvice(){
  const knee=kneeStatus(),next=nextPlannedRun(),lastCodes=lastRunCodes(3),lastHard=lastHardDays(),weak=weaknessModel()[0]?.key;
  let code="R1",why="Construire la tolérance et l’endurance sans ajouter de fatigue inutile.",fun="Choisis un parcours agréable et cours uniquement au ressenti.";
  if(knee.level==="danger"){
    code="R1";why="La réaction des genoux est trop élevée pour une séance rapide. Priorité au plat, facile, et à une durée réduite.";fun="Fais un aller-retour : demi-tour à mi-temps, sans regarder l’allure.";
  }else if(knee.level==="warn"){
    code="R1";why="Les genoux sont encore en zone orange. On garde une D facile mais on peut la rendre moins monotone sans accélérations franches.";fun="Toutes les 8 minutes, 20 s de pas légèrement plus courts, puis retour facile.";
  }else if(knee.level==="mid"){
    code="R1";why="Le suivi à 1 h / J+1 / 48 h n’est pas encore assez complet pour valider une D rapide. On construit d’abord une base sûre.";fun="Choisis un trajet en boucle : à chaque tour, change seulement le point d’attention (posture, respiration, cadence), pas la vitesse.";
  }else{
    const candidates=weak==="climbPower"||weak==="climbEndurance"?["R5","R7","R8","R3"]:weak==="10k"?["R4","R3","R7","R2"]:["R8","R7","R3","R2"];
    code=candidates.find(c=>!lastCodes.includes(c))||candidates[0];
    if(lastHard<2.5){code="R1";why="Une charge jambes exigeante est récente : aujourd’hui, une D facile donnera plus de bénéfice qu’une deuxième séance dure.";fun="Course exploration : change une rue ou un chemin habituel, sans changer l’intensité.";}
    else if(code==="R5"){why="Tes indicateurs de montée restent prioritaires : une petite dose de côte travaille puissance et technique sans faire une longue séance.";fun="Choisis une côte courte et régulière ; compte les répétitions, pas la vitesse.";}
    else if(code==="R4"){why="Le prochain levier pour le 10 km est de rendre l’allure proche de 5:00/km plus familière, sans courir toute la séance vite.";fun="Chaque répétition est un mini-défi de régularité : cherche l’écart d’allure le plus faible.";}
    else if(code==="R3"){why="Le tempo améliore la capacité à tenir une allure soutenue, utile pour ton objectif 10 km.";fun="Cours les blocs au ressenti 7/10 et regarde l’allure seulement après.";}
    else if(code==="R7"){why="Le fartlek apporte de la vitesse avec moins de rigidité qu’un fractionné au chrono et évite la monotonie.";fun="Sur chaque minute vive, choisis un repère devant toi plutôt qu’une vitesse précise.";}
    else if(code==="R8"){why="Une progressive développe l’endurance et la maîtrise d’allure avec une charge mécanique plus douce qu’un fractionné.";fun="Objectif : chaque tiers légèrement plus rapide que le précédent, sans sprint final.";}
    else {why="Un peu de vitesse courte est utile, à condition que les genoux restent calmes après les sorties.";fun="Alterne une minute vive / une minute facile et arrête les répétitions si la foulée se dégrade.";}
  }
  const sess=sessionBy(code);return {code,session:sess,why,fun,next,knee};
}
function runCalendarDay(d,currentMonth){
  const k=dateKey(d),runs=[];plansOn(k).filter(p=>isRunCode(p.code)&&p.status!=="skipped").forEach(p=>runs.push({done:p.status==="done"}));historyOn(k).filter(h=>h.type==="run").forEach(()=>runs.push({done:true}));
  const cls=["day",d.getMonth()!==currentMonth?"other":"",k===todayKey()?"today":""].filter(Boolean).join(" ");
  return `<div class="${cls}" onclick="selectedDate='${k}';calendarCursor=new Date(${d.getFullYear()},${d.getMonth()},1,12);activeTab='activity';activityMode='month';render()"><div class="daynum">${d.getDate()}</div>${runs.length?`<div class="daydots"><span class="dot run ${runs.some(x=>x.done)?"done":""}">D</span></div>`:""}</div>`;
}
function runFollowupList(){
  const hs=state.history.filter(h=>h.type==="run").sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);
  if(!hs.length)return `<p class="muted">Après ta première D, le suivi genou apparaîtra ici.</p>`;
  return hs.map(h=>{const k=h.run?.knee||{};const pending=k.oneHour==null||k.nextMorning==null||k.after48h==null;return `<div class="kpi"><div><strong>${esc(fmtDate(historyDateKey(h)))} · ${esc(runVariantLabel(h.code))}</strong><div class="small">départ ${k.start??"—"} · 1 h ${k.oneHour??"—"} · J+1 ${k.nextMorning??"—"} · 48 h ${k.after48h??"—"}</div></div><button class="mini ${pending?"":"good"}" onclick="editKnee('${h.id}')">${pending?"Compléter":"Modifier"}</button></div>`}).join("");
}
function renderRunning(){
  const first=new Date(runCursor.getFullYear(),runCursor.getMonth(),1,12),gridStart=startOfWeek(first),days=Array.from({length:42},(_,i)=>addDays(gridStart,i)),monthRuns=plannedRunsInMonth(first),ad=runningCoachAdvice(),s=ad.session,next=ad.next;
  view.innerHTML=`<div class="section-title"><div><h2>Course · D</h2><div class="small">objectif 10 km &lt; 50 min · variété + efficacité</div></div><span class="badge blue">coach</span></div>
  <section class="card hero"><div class="row between"><span class="badge blue">PROCHAINE D CONSEILLÉE</span>${kneeBadge()}</div><div class="big" style="margin-top:10px">${esc(s.title)}</div><p class="muted">${esc(ad.why)}</p><div class="card soft"><strong>Version ludique</strong><p class="small">${esc(ad.fun)}</p></div><div class="notice ${ad.knee.level}">${esc(ad.knee.text)}</div><div class="action-grid"><button class="primary" onclick="planCoachRun()">Adapter la prochaine D</button><button class="secondary" onclick="openSession('${s.code}','${todayKey()}',null)">Faire cette D aujourd’hui</button></div>${next?`<div class="small" style="margin-top:10px">Actuellement prévu : ${esc(fmtDate(next.date))} · ${esc(runVariantLabel(next.plan.code))}</div>`:""}</section>
  <section class="card"><div class="calendar-head"><button class="ghost" onclick="moveRunMonth(-1)">‹</button><div class="calendar-title">${esc(monthTitle(first))}</div><button class="ghost" onclick="moveRunMonth(1)">›</button></div><div class="calendar-weekdays"><div>Lun</div><div>Mar</div><div>Mer</div><div>Jeu</div><div>Ven</div><div>Sam</div><div>Dim</div></div><div class="calendar-grid">${days.map(d=>runCalendarDay(d,first.getMonth())).join("")}</div></section>

  <div class="section-title"><h2>Variantes</h2><span class="small">pour ne pas courir toujours pareil</span></div>${state.sessions.filter(x=>x.type==="run").map(x=>`<div class="card session-card clickable" onclick="openSession('${x.code}','${todayKey()}',null)"><div class="code run">D</div><div><strong>${esc(x.title)}</strong><p>${esc(x.goal)} · ≈ ${x.duration} min</p></div><div class="chev">›</div></div>`).join("")}`;
}
function runPlanRow(k,p){const s=sessionBy(p.code);return `<div class="run-plan-row"><div><div class="small">${esc(fmtDate(k))}</div><strong>D · ${esc(s?.title||planTitle(p))}</strong><div class="small">${esc(p.runMain||s?.run?.main||"")}</div>${p.note?`<div class="tiny">${esc(p.note)}</div>`:""}</div><div class="plan-actions">${p.status==="done"?`<span class="badge good">✓</span>`:`<button class="mini" onclick="movePlanDialog('${k}','${p.id}')">Déplacer</button>`}</div></div>`}
function moveRunMonth(n){runCursor=new Date(runCursor.getFullYear(),runCursor.getMonth()+n,1,12);render()}
function planCoachRun(){
  const ad=runningCoachAdvice(),next=ad.next;
  if(next){next.plan.code=ad.code;next.plan.plannedDuration=ad.session.duration;next.plan.runMain=ad.session.run?.main||"";next.plan.note=`Adapté par le coach : ${ad.why}`;save();runCursor=new Date(parseDateKey(next.date).getFullYear(),parseDateKey(next.date).getMonth(),1,12);render();return}
  const start=parseDateKey(todayKey());let target=null;for(let i=0;i<7;i++){const k=dateKey(addDays(start,i));if(!plansOn(k).some(p=>isRunCode(p.code))){target=k;break}}target=target||todayKey();state.planned[target]=state.planned[target]||[];state.planned[target].push(makePlan(ad.code,{plannedDuration:ad.session.duration,runMain:ad.session.run?.main||"",note:`Conseil coach : ${ad.why}`}));save();runCursor=new Date(parseDateKey(target).getFullYear(),parseDateKey(target).getMonth(),1,12);render();
}

  const hs=[...state.history].sort((a,b)=>new Date(b.date)-new Date(a.date));
  view.innerHTML=`<div class="section-title"><h2>Historique</h2><span class="badge">${hs.length} séance(s)</span></div><section class="card">${hs.length?hs.map(h=>historyItem(h)).join(""):`<p class="muted">Aucune séance enregistrée pour l’instant.</p>`}</section>`;

function historyItem(h){

function editKnee(id){

function nullableNumber(id){const v=document.getElementById(id).value;return v===""?null:+v}
function saveKnee(id){const h=state.history.find(x=>x.id===id);if(!h?.run)return;h.run.knee={start:nullableNumber("kStart"),after2k:nullableNumber("k2"),oneHour:nullableNumber("k1h"),nextMorning:nullableNumber("kNext"),after48h:nullableNumber("k48")};save();quickDialog.close();render()}

function plannedCompletion(days=28){
  const end=parseDateKey(todayKey()),start=addDays(end,-days+1);let planned=0,done=0;
  Object.keys(state.planned).forEach(k=>{const d=parseDateKey(k);if(d>=start&&d<=end)plansOn(k).forEach(p=>{if(p.code!=="REST"&&p.status!=="skipped"){planned++;if(p.status==="done"||historyOn(k).some(h=>h.code===p.code))done++}})});
  return {planned,done,pct:planned?Math.round(done/planned*100):0};
}
function squatSnapshot(){
  const hs=state.history.filter(h=>h.type==="strength"&&h.strength?.["Squat au banc"]).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!hs.length)return null;const sets=hs[0].strength["Squat au banc"].filter(s=>s.done);if(!sets.length)return null;return {date:historyDateKey(hs[0]),sets,text:sets.map(s=>`${s.kg||0}kg×${s.reps||0}${s.rir!==undefined&&s.rir!==""?` RIR${s.rir}`:""}`).join(" · ")};
}
function correlationKneeAfterC(){
  const runs=state.history.filter(h=>h.run?.knee?.oneHour!=null);
  const afterC=[],without=[];
  runs.forEach(r=>{
    const rt=new Date(r.date).getTime();
    const cRecent=state.history.some(h=>h.code==="C"&&new Date(h.date).getTime()<rt&&(rt-new Date(h.date).getTime())<=48*3600000);
    (cRecent?afterC:without).push(num(r.run.knee.oneHour));
  });
  if(afterC.length>=2&&without.length>=2){const a=avg(afterC),b=avg(without);const diff=a-b;return {ready:true,text:`Douleur à 1 h : ${a.toFixed(1)}/10 quand une C précède de <48 h, contre ${b.toFixed(1)}/10 sinon (${diff>=0?"+":""}${diff.toFixed(1)}).`};}
  return {ready:false,text:"Il faut au moins 2 sorties avec suivi genou dans chaque situation (avec/sans C dans les 48 h) pour calculer cette corrélation."};
}

function startWorkoutClock(){clearInterval(workoutTimer);function paint(){const el=document.getElementById("elapsedBox");if(!el)return;const sec=Math.floor((Date.now()-workoutStart)/1000);el.textContent=`${pad(Math.floor(sec/60))}:${pad(sec%60)}`}paint();workoutTimer=setInterval(paint,1000)}
function lastExerciseSets(code,name){const last=state.history.filter(h=>h.code===code&&h.strength?.[name]).sort((a,b)=>new Date(b.date)-new Date(a.date))[0];return last?last.strength[name]:null}

function targetRepHigh(txt){const nums=(String(txt).match(/\d+/g)||[]).map(Number);return nums.length?Math.max(...nums):0}
function previousEx(code,name){const sets=lastExerciseSets(code,name);if(!sets)return "Aucun historique";const vals=sets.filter(x=>x.done).map(x=>`${x.kg||0}kg×${x.reps||0}${x.rir!==undefined&&x.rir!==""?` RIR${x.rir}`:x.rpe?` RPE${x.rpe}`:""}`);return vals.length?`Dernière fois : ${vals.join(" · ")}`:"Aucun historique"}
function suggestedLoad(code,e){
  const sets=lastExerciseSets(code,e.name);if(!sets)return null;const done=sets.filter(x=>x.done&&num(x.kg)>0);if(!done.length)return null;

function saveStrength(code){const S=sessionBy(code);if(!S)return;const lines=document.getElementById("strengthEditor").value.split("\n").map(x=>x.trim()).filter(Boolean);const ex=lines.map(l=>{const [name,sets,reps,rest]=l.split("|").map(x=>x.trim());return {name,sets:num(sets)||3,reps:reps||"8",rest:num(rest)||90,increment:2.5}}).filter(x=>x.name);if(ex.length){S.exercises=ex;save()}quickDialog.close();render()}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`coach-10k-force-backup-${todayKey()}.json`;a.click();URL.revokeObjectURL(a.href)}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);state=normalizeState(x);state.planInitialized=!!x.planInitialized||Object.keys(state.planned).length>0;save();alert("Import réussi.");render()}catch(e){alert("Fichier non reconnu.")}};r.readAsText(file)}
async function clearCaches(){if("caches" in window){for(const k of await caches.keys())await caches.delete(k)}if(navigator.serviceWorker?.controller)navigator.serviceWorker.controller.postMessage({type:"SKIP_WAITING"});alert("Cache vidé. Recharge la page.");location.reload(true)}

let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("installBtn").classList.remove("hidden")});
document.getElementById("installBtn").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById("installBtn").classList.add("hidden")}};
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=3.1.0").catch(()=>{}))}

function boot(){
  try{render()}catch(err){console.error(err);const v=document.getElementById("view");if(v){v.innerHTML=`<section class="card hero"><h2>Réparation nécessaire</h2><p>L’application a rencontré une donnée locale incompatible.</p><button class="primary full" id="repairBtn">Réparer sans supprimer l’historique</button><button class="ghost full" style="margin-top:8px" id="resetBtn">Réinitialiser l’application</button><p class="small" style="margin-top:10px">Erreur : ${esc(err?.message||String(err))}</p></section>`;document.getElementById("repairBtn").onclick=()=>{state=normalizeState(state);save();location.reload()};document.getElementById("resetBtn").onclick=()=>{if(confirm("Réinitialiser les données locales ?")){localStorage.removeItem(STORE);location.reload()}}}}
}
window.addEventListener("error",e=>console.error("APP ERROR",e.error||e.message));
boot();

  </script>
</body>
</html>
